server:
  port: ${PORT:2333}     # Railway injects PORT, fallback 2333
  address: 0.0.0.0       # must bind to all interfaces

lavalink:
  server:
    password: ${SERVER_PASSWORD:youshallnotpass}  # use Railway env var
    sources:
      youtube: true
      soundcloud: false
      bandcamp: false
      twitch: false
      vimeo: false
      mixcloud: false
      http: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: false
    gc-warning: true

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    lavaplayer: INFO
    lavaplayer-events: INFO