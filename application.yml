server:
  port: ${PORT:8080}      # Use Railway's injected port (usually 8080)
  address: 0.0.0.0        # Bind to all interfaces

lavalink:
  server:
    password: "youshallnotpass"   # Must match Peaceful Spirit variable
    sources:
      youtube: true
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
